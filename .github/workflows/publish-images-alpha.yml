name: Publicar imágenes (alpha)

# Construye y publica las imágenes de dev (backend + frontend) a GHCR con tag
# `alpha`, para probar en staging.unam.dev antes de mergear a main. Análogo a
# publish-images.yml, pero disparado por dev y sin el tag `latest` (ese es
# exclusivo del build de main, ver ADR 0025).
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: atenea-backend
            context: ./backend
          - name: atenea-frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=alpha
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Mismo build-arg que publish-images.yml: VITE_API_BASE_URL="" =>
          # el SPA llama a la API en el mismo origen. El client id de Google
          # no se hornea, se inyecta en runtime vía /config.js (ver
          # src/config.ts) — este build-arg solo aplica al frontend.
          build-args: |
            VITE_API_BASE_URL=
