name: Publicar imágenes

# Construye y publica las imágenes de producción (backend + frontend) a GHCR.
# Solo corre al hacer merge a main; el despliegue en el servicio services/ hace
# `docker compose pull` de estas imágenes (ver docs/development/despliegue-produccion.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: atenea-backend
            context: ./backend
          - name: atenea-frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # VITE_API_BASE_URL="" => el SPA llama a la API en el mismo origen
          # (atenea.unam.dev). Es constante, por eso se hornea en build.
          # El client id de Google NO se hornea: se inyecta en runtime vía
          # /config.js desde ATENEA_GOOGLE_CLIENT_ID del deploy (ver src/config.ts),
          # así no vive en el CI. Este build-arg solo aplica al frontend.
          build-args: |
            VITE_API_BASE_URL=
