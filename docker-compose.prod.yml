services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    # celery-worker usa la misma imagen que backend, que ahora trae el HEALTHCHECK
    # HTTP de backend/Dockerfile (http://localhost:8000/api/health/). Este servicio
    # no corre gunicorn ni escucha en :8000, así que ese chequeo jamás pasaría —
    # se deshabilita explícitamente en vez de reportar "unhealthy" para siempre.
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    depends_on:
      - backend
