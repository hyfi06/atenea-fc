server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js se regenera en cada arranque del contenedor con el client id del
    # deploy; no debe cachearse para que un redeploy tome efecto de inmediato.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
