server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (hallazgo M1 del pentest 2026-08-18). Mismos valores
    # que SecurityMiddleware ya aplica en el backend, ver
    # backend/config/settings/prod.py — se replican, no se inventan.
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSP (hallazgo M3). Acotada a lo que la SPA carga de verdad: /config.js e
    # index.html son propios ('self'), y Google Identity Services necesita
    # accounts.google.com/gsi/ en script-src/style-src/connect-src/frame-src
    # (ver frontend/src/auth/google.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # config.js se regenera en cada arranque del contenedor con el client id del
    # deploy; no debe cachearse para que un redeploy tome efecto de inmediato.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
